<style>
        .glass-flare {
            position: absolute;
            top: -20px;
            right: -20px;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%);
            pointer-events: none;
            opacity: 0.15;
            z-index: 10;
        }
        /* Custom scrollbar hiding for horizontal scroll areas */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background min-h-screen pb-[90px] relative antialiased">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface-bright dark:bg-surface-dim shadow-[0px_4px_20px_rgba(0,33,64,0.05)] z-40">
<div class="flex justify-between items-center px-4 py-stack-sm w-full max-w-2xl mx-auto">
<div class="w-8"></div>
<h1 class="font-headline-md text-headline-md text-on-surface">资产</h1>
<button class="hover:bg-surface-container-low transition-colors active:scale-95 transition-transform rounded-full w-8 h-8 flex items-center justify-center text-primary">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</header>
<main class="w-full max-w-2xl mx-auto px-4 py-stack-md">
<!-- Filter Bar -->
<section class="mb-stack-sm">
<div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-2">
<button class="flex items-center gap-1 bg-surface-container-lowest border border-outline-variant px-4 py-2 rounded-full hover:bg-surface-container-low transition-colors active:scale-95 flex-shrink-0">
<span class="font-label-bold text-label-bold text-on-surface">成员</span>
<span class="material-symbols-outlined text-[18px] text-outline">arrow_drop_down</span>
</button>
<button class="flex items-center gap-1 bg-surface-container-lowest border border-outline-variant px-4 py-2 rounded-full hover:bg-surface-container-low transition-colors active:scale-95 flex-shrink-0">
<span class="font-label-bold text-label-bold text-on-surface">分类</span>
<span class="material-symbols-outlined text-[18px] text-outline">arrow_drop_down</span>
</button>
</div>
</section>
<!-- Summary Row -->
<section class="mb-stack-md flex justify-between items-center bg-surface-container-lowest p-4 rounded-xl shadow-sm border border-outline-variant/30">
<div>
<p class="font-label-sm text-label-sm text-on-surface-variant mb-1">资产总额</p>
<p class="font-headline-md text-headline-md text-primary">¥ 6,070,000.00</p>
</div>
<div class="text-right">
<p class="font-label-sm text-label-sm text-on-surface-variant mb-1">负债总额</p>
<p class="font-headline-md text-headline-md text-error">- ¥ 3,500,000.00</p>
</div>
</section>
<!-- Cards List -->
<section class="flex flex-col gap-4 relative">
<!-- Group: Cash / Deposits -->
<div>
<h2 class="font-label-bold text-label-bold text-on-surface-variant mb-2 pl-2">现金与存款</h2>
<!-- Asset Row -->
<div class="bg-surface-container-lowest rounded-xl shadow-sm p-4 relative overflow-hidden border border-outline-variant/30 mb-2 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container flex-shrink-0">
<span class="material-symbols-outlined">account_balance</span>
</div>
<div>
<h3 class="font-body-md text-body-md font-semibold text-on-surface">招商银行存款</h3>

</div>
</div>
<div class="text-right">
<div class="font-body-lg text-body-lg font-bold text-primary">¥ 1,250,000.00</div>
</div>
</div>
</div>
<!-- Group: Investments -->
<div>
<h2 class="font-label-bold text-label-bold text-on-surface-variant mb-2 pl-2 mt-4">投资与理财</h2>
<!-- Asset Row -->
<div class="bg-surface-container-lowest rounded-xl shadow-sm p-4 relative overflow-hidden border border-outline-variant/30 mb-2 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container flex-shrink-0">
<span class="material-symbols-outlined">trending_up</span>
</div>
<div>
<h3 class="font-body-md text-body-md font-semibold text-on-surface">高腾私募基金</h3>

</div>
</div>
<div class="text-right">
<div class="font-body-lg text-body-lg font-bold text-primary">¥ 4,820,000.00</div>
</div>
</div>
</div>
<!-- Group: Liabilities -->
<div>
<h2 class="font-label-bold text-label-bold text-on-surface-variant mb-2 pl-2 mt-4">负债</h2>
<!-- Liability Row -->
<div class="bg-surface-container-lowest rounded-xl shadow-sm p-4 relative overflow-hidden border border-outline-variant/30 mb-2 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-error-container flex items-center justify-center text-on-error-container flex-shrink-0">
<span class="material-symbols-outlined">real_estate_agent</span>
</div>
<div>
<h3 class="font-body-md text-body-md font-semibold text-on-surface">世纪大道房贷</h3>

</div>
</div>
<div class="text-right">
<div class="font-body-lg text-body-lg font-bold text-error">- ¥ 3,500,000.00</div>
</div>
</div>
</div>
<!-- Empty State (Hidden by default) -->
<div class="hidden flex-col items-center justify-center py-16 px-4 text-center">
<div class="w-40 h-40 mb-6 flex items-center justify-center">
<img class="w-full h-full object-contain opacity-50 grayscale" data-alt="Empty folder illustration" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB88mSbVahTPoBJmKzovAgmWRkBuuQWRIm7qQE9jWR4H2UjLQ3VfL8-Ck2j28_3U_4Az9IY82Qm6PS70Is7YHbgoNZFLc6H6gUwx5T0mAf2Qyc8-D1KGpRblud-dFE9wC3HF1lPSV4Nl_XOp443uuV4peHhVD-5NR2ylNutQkXXTKWMj8W57aWyrY8mWWPsjivFEBm_YeEoTzeOU-m38IDwScO5xVJShxuskkvNPyQjFiRp_HfxyzcWLA">
</div>
<p class="font-body-md text-body-md text-on-surface-variant">还没有资产记录，点击右下角添加</p>
</div>
</section>
</main>
<!-- Floating Action Button (FAB) -->
<button class="fixed bottom-24 right-4 md:right-8 z-40 bg-primary hover:bg-surface-tint text-on-primary w-14 h-14 rounded-full shadow-lg flex items-center justify-center active:scale-90 transition-all duration-200 focus:outline-none focus:ring-4 focus:ring-primary-fixed-dim">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: &quot;FILL&quot; 0;">add</span>
</button>
<!-- BottomNavBar (Mobile Shell) -->
<nav class="fixed bottom-0 w-full z-50 rounded-t-xl md:hidden border-t border-outline-variant dark:border-outline shadow-[0px_-4px_20px_rgba(0,33,64,0.05)] bg-surface-container-lowest dark:bg-inverse-surface flex justify-around items-center px-4 py-2">
<!-- Overview -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-surface-container-high dark:hover:bg-surface-variant transition-colors active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined">dashboard</span>
<span class="font-label-sm text-label-sm mt-1">总览</span>
</a>
<!-- Assets (ACTIVE) -->
<a class="flex flex-col items-center justify-center bg-secondary-container dark:bg-on-secondary-fixed-variant text-on-secondary-container dark:text-on-primary-container rounded-full px-6 py-1.5 hover:bg-surface-container-high dark:hover:bg-surface-variant transition-colors active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: &quot;FILL&quot; 1;">account_balance</span>
<span class="font-label-sm text-label-sm mt-0.5">资产</span>
</a>
<!-- Ledger -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-surface-container-high dark:hover:bg-surface-variant transition-colors active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined">receipt_long</span>
<span class="font-label-sm text-label-sm mt-1">账本</span>
</a>
<!-- Settings -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-surface-container-high dark:hover:bg-surface-variant transition-colors active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined">settings</span>
<span class="font-label-sm text-label-sm mt-1">设置</span>
</a>
</nav>


</body></html>
