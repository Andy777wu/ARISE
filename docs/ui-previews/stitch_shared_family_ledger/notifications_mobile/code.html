<div class="app-container">

<!-- Notification Item 1 (Unread) -->
<div class="bg-surface-container-lowest rounded-xl p-4 card-shadow relative overflow-hidden border border-outline-variant border-opacity-30 group hover:border-primary-fixed transition-colors">

<div class="absolute top-4 right-4 w-2 h-2 rounded-full bg-error"></div>
<div class="flex items-start gap-4">
<div class="flex-shrink-0 w-10 h-10 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center">

</div>
<div class="flex-grow">
<div class="flex justify-between items-start mb-1">
<h2 class="font-label-bold text-on-surface pr-4">张三 邀请您加入家庭</h2>
</div>
<p class="font-body-md text-on-surface-variant text-sm mb-2">家庭：我的家</p>
<p class="font-label-sm text-outline mb-4">5 分钟前</p>
<div class="flex gap-3">
<button class="flex-1 bg-primary text-on-primary font-label-bold py-2 rounded-lg active:scale-95 transition-transform duration-150 shadow-sm">
                                同意
                            </button>
<button class="flex-1 border border-primary text-primary font-label-bold py-2 rounded-lg active:scale-95 transition-transform duration-150 hover:bg-surface-container-low">
                                拒绝
                            </button>
</div>
</div>
</div>
</div>

</div>
<div class="flex-grow">
<div class="flex justify-between items-start mb-1">
<h2 class="font-label-bold text-on-surface">李四 邀请您加入家庭</h2>

</div>
<p class="font-body-md text-on-surface-variant text-sm mb-1">家庭：李四的家</p>

</div>
