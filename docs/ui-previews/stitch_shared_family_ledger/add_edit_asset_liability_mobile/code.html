<body class="bg-background text-on-background flex flex-col min-h-screen md:max-w-md md:mx-auto md:border-x md:border-outline-variant md:shadow-lg relative">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-background w-full top-0 sticky border-b border-outline-variant dark:border-outline flat no shadows flex items-center justify-between px-container-margin h-16 w-full z-10">

<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary dark:text-primary-fixed-dim">ARISE</h1>
</div>
<div class="flex items-center cursor-pointer active:opacity-80 hover:bg-surface-container-low transition-colors px-2 py-1 rounded">

</div>
</header>
<!-- Main Content -->
<main class="flex-1 p-container-margin flex flex-col gap-stack-lg overflow-y-auto no-scrollbar">
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">添加资产/负债</h2>
<!-- Form Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-[16px] p-gutter flex flex-col gap-stack-md">
<!-- Name -->
<div class="flex flex-col gap-base-unit">
<label class="font-body-sm text-body-sm text-on-surface font-semibold" for="asset-name">名称 <span class="text-error">*</span></label>
<input class="bg-surface-container-low border border-outline-variant text-on-surface font-body-lg text-body-lg rounded-lg px-3 py-2 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary w-full" id="asset-name" placeholder="如：招商银行活期" type="text">
</div>
<!-- Category -->
<div class="flex flex-col gap-base-unit">
<label class="font-body-sm text-body-sm text-on-surface font-semibold" for="asset-category">分类 <span class="text-error">*</span></label>
<div class="relative cursor-pointer">
<input class="bg-surface-container-low border border-outline-variant text-on-surface font-body-lg text-body-lg rounded-lg px-3 py-2 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary w-full cursor-pointer pr-10" id="asset-category" placeholder="请选择分类" readonly="" type="text">
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">chevron_right</span>
</div>

</div>
<!-- Amount -->
<div class="flex flex-col gap-base-unit">
<label class="font-body-sm text-body-sm text-on-surface font-semibold" for="asset-amount">金额 <span class="text-error">*</span></label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant font-body-lg text-body-lg">¥</span>
<input class="bg-surface-container-low border border-outline-variant text-on-surface font-headline-md text-headline-md rounded-lg pl-8 pr-3 py-3 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary w-full tracking-wide" id="asset-amount" placeholder="0.00" step="0.01" type="number">
</div>
</div>
<!-- Account Type -->
<div class="flex flex-col gap-base-unit">


<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-on-surface-variant" style="margin-top: 28px;">
<span class="material-symbols-outlined">expand_more</span>
</div>
</div>
<!-- Date -->
<div class="flex flex-col gap-base-unit">


</div>
<!-- Remark -->
<div class="flex flex-col gap-base-unit">


</div>
