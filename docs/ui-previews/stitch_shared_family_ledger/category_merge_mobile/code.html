<body class="bg-surface-canvas text-on-surface font-body-lg h-screen flex flex-col relative overflow-hidden">
<!-- Header (P08 TopAppBar mapping) -->
<header class="fixed top-0 w-full z-50 bg-surface-bright border-b border-outline-variant flex items-center justify-between px-margin-lg h-16 shadow-sm">
<button class="text-on-surface-variant hover:text-primary font-body-lg transition-colors" type="button">
            取消
        </button>
<h1 class="font-headline-md text-headline-md font-bold text-surface-tint">
            分类合并
        </h1>
<div class="w-8"></div> <!-- Spacer to center title -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto pt-16 pb-48">
<!-- Top Banner/Tip -->
<div class="bg-primary-fixed-dim/20 px-margin-lg py-stack-md flex items-center gap-2 border-b border-outline-variant/50">
<span class="material-symbols-outlined text-primary text-[18px]">info</span>
<p class="font-body-sm text-on-surface-variant">请选择要合并的分类（2 个及以上）</p>
</div>
<!-- Category List -->
<div class="bg-surface">
<!-- Item 1: Selected -->
<label class="flex items-center px-margin-lg py-stack-md border-b border-outline-variant bg-selection-bg cursor-pointer transition-colors hover:bg-selection-bg/80">
<input checked="" class="peer sr-only" type="checkbox">
<div class="w-5 h-5 rounded-[8px] border-2 border-primary bg-primary flex items-center justify-center mr-stack-md flex-shrink-0 transition-all">
<span class="material-symbols-outlined text-on-primary text-[14px]">check</span>
</div>
<div class="flex items-center gap-3 flex-1">
<div class="w-10 h-10 rounded-full bg-primary-fixed/50 flex items-center justify-center text-primary">
<span class="material-symbols-outlined">directions_car</span>
</div>
<span class="font-tree-node text-tree-node text-on-surface">交通出行</span>
</div>
</label>
<!-- Item 2: Selected -->
<label class="flex items-center px-margin-lg py-stack-md border-b border-outline-variant bg-selection-bg cursor-pointer transition-colors hover:bg-selection-bg/80">
<input checked="" class="peer sr-only" type="checkbox">
<div class="w-5 h-5 rounded-[8px] border-2 border-primary bg-primary flex items-center justify-center mr-stack-md flex-shrink-0 transition-all">
<span class="material-symbols-outlined text-on-primary text-[14px]">check</span>
</div>
<div class="flex items-center gap-3 flex-1">
<div class="w-10 h-10 rounded-full bg-primary-fixed/50 flex items-center justify-center text-primary">
<span class="material-symbols-outlined">local_gas_station</span>
</div>
<span class="font-tree-node text-tree-node text-on-surface">加油费</span>
</div>
</label>
<!-- Item 3: Unselected -->
<label class="flex items-center px-margin-lg py-stack-md border-b border-outline-variant bg-surface cursor-pointer transition-colors hover:bg-surface-container-low">
<input class="peer sr-only" type="checkbox">
<div class="w-5 h-5 rounded-[8px] border-2 border-outline-variant bg-surface flex items-center justify-center mr-stack-md flex-shrink-0 transition-all peer-checked:bg-primary peer-checked:border-primary">
<span class="material-symbols-outlined text-on-primary text-[14px] opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
<div class="flex items-center gap-3 flex-1">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">local_taxi</span>
</div>
<span class="font-tree-node text-tree-node text-on-surface">打车费</span>
</div>
</label>
<!-- Item 4: Unselected -->
<label class="flex items-center px-margin-lg py-stack-md border-b border-outline-variant bg-surface cursor-pointer transition-colors hover:bg-surface-container-low">
<input class="peer sr-only" type="checkbox">
<div class="w-5 h-5 rounded-[8px] border-2 border-outline-variant bg-surface flex items-center justify-center mr-stack-md flex-shrink-0 transition-all peer-checked:bg-primary peer-checked:border-primary">
<span class="material-symbols-outlined text-on-primary text-[14px] opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
<div class="flex items-center gap-3 flex-1">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">train</span>
</div>
<span class="font-tree-node text-tree-node text-on-surface">公共交通</span>
</div>
</label>
</div>
</main>
<!-- Bottom Sheet / Merge Action Bar -->
<div class="fixed bottom-0 w-full z-50 bg-surface shadow-[0_-4px_20px_rgba(0,0,0,0.08)] border-t border-outline-variant pb-[env(safe-area-inset-bottom)] rounded-t-2xl">
<div class="p-margin-lg flex flex-col gap-stack-md">
<!-- Input Field -->
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">new_label</span>
</div>
<input class="w-full bg-surface-container-low border border-transparent focus:border-primary focus:bg-surface rounded-lg pl-10 pr-4 py-3 font-body-lg text-on-surface outline-none transition-colors placeholder:text-outline" placeholder="新分类名称" type="text">
</div>
<!-- Primary Action Button -->
<button class="w-full bg-primary text-on-primary font-headline-md text-headline-md py-3 rounded-full flex items-center justify-center gap-2 active:opacity-70 transition-opacity shadow-sm">
<span class="material-symbols-outlined">call_merge</span>
                确认合并
            </button>
</div>
