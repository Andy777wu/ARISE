<!DOCTYPE html><html class="light" lang="zh-CN"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>分类管理 - ARISE Finance</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container": "#f0edef",
                        "surface-tint": "#0059c7",
                        "outline": "#727786",
                        "warning": "#faad14",
                        "on-primary-fixed-variant": "#004398",
                        "on-tertiary": "#ffffff",
                        "on-surface": "#1b1b1d",
                        "tertiary": "#9e3d00",
                        "error": "#ba1a1a",
                        "error-container": "#ffdad6",
                        "background": "#fcf8fb",
                        "on-secondary": "#ffffff",
                        "primary-fixed": "#d9e2ff",
                        "outline-variant": "#c1c6d7",
                        "primary-container": "#006ef2",
                        "on-error-container": "#93000a",
                        "surface-variant": "#e4e2e4",
                        "primary-fixed-dim": "#afc6ff",
                        "on-secondary-fixed": "#191c1d",
                        "on-secondary-container": "#626566",
                        "surface": "#fcf8fb",
                        "tertiary-fixed": "#ffdbcd",
                        "surface-container-lowest": "#ffffff",
                        "secondary-container": "#e1e3e4",
                        "on-error": "#ffffff",
                        "primary": "#0057c2",
                        "on-primary-container": "#fefcff",
                        "on-tertiary-fixed": "#351000",
                        "secondary": "#5c5f60",
                        "selection-bg": "#e6f7ff",
                        "on-tertiary-fixed-variant": "#7c2e00",
                        "surface-container-high": "#eae7ea",
                        "tertiary-fixed-dim": "#ffb595",
                        "surface-dim": "#dcd9dc",
                        "outline-muted": "#c1c6d7",
                        "on-tertiary-container": "#fffbff",
                        "inverse-on-surface": "#f3f0f2",
                        "tertiary-container": "#bf551c",
                        "inverse-surface": "#303032",
                        "success": "#52c41a",
                        "on-primary-fixed": "#001a43",
                        "surface-container-highest": "#e4e2e4",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed-variant": "#444748",
                        "inverse-primary": "#afc6ff",
                        "surface-bright": "#fcf8fb",
                        "surface-canvas": "#fcf8fb",
                        "on-background": "#1b1b1d",
                        "surface-container-low": "#f6f3f5",
                        "secondary-fixed-dim": "#c5c7c8",
                        "secondary-fixed": "#e1e3e4",
                        "on-surface-variant": "#414755"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "tree-indent": "24px",
                        "margin-lg": "24px",
                        "stack-md": "16px",
                        "base": "4px",
                        "node-gap": "8px",
                        "gutter-md": "16px"
                    },
                    "fontFamily": {
                        "headline-md": ["Manrope"],
                        "headline-lg-mobile": ["Manrope"],
                        "label-caps": ["Manrope"],
                        "body-lg": ["Manrope"],
                        "headline-lg": ["Manrope"],
                        "tree-node": ["Manrope"],
                        "body-sm": ["Manrope"]
                    },
                    "fontSize": {
                        "headline-md": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "tree-node": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-canvas text-on-surface font-body-lg min-h-screen pb-24">
<!-- TopAppBar -->
<header class="bg-surface-bright dark:bg-surface-dim font-headline-md text-headline-md fixed top-0 w-full z-50 border-b border-outline-variant dark:border-outline-muted flex items-center justify-between px-margin-lg h-16 max-w-7xl mx-auto shadow-sm">
<button aria-label="返回" class="text-primary dark:text-primary-fixed-dim hover:bg-surface-container-low transition-colors active:opacity-70 p-2 rounded-full -ml-2">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-surface-tint">分类管理</h1>
<button aria-label="合并" class="text-primary dark:text-primary-fixed-dim hover:bg-surface-container-low transition-colors active:opacity-70 font-tree-node text-tree-node px-3 py-1 rounded">
            合并
        </button>
</header>
<!-- Main Content -->
<main class="pt-20 px-gutter-md max-w-lg mx-auto">
<!-- Toolbar: Add Category Button -->
<div class="mb-stack-md mt-stack-sm">
<button class="w-full bg-primary text-on-primary font-headline-md text-headline-md rounded-xl py-3 flex items-center justify-center gap-2 hover:bg-surface-tint transition-colors active:scale-95 shadow-sm">
<span class="material-symbols-outlined font-bold" data-icon="add" style="font-variation-settings: 'FILL' 1;">add</span>
                新增分类
            </button>
</div>
<!-- Category Tree (Bento/Card Style) -->
<div class="space-y-stack-md">
<!-- Category Block 1 -->
<div class="bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant overflow-hidden">
<!-- Level 1 -->
<div class="flex items-center justify-between p-stack-md hover:bg-surface-container-low transition-colors cursor-pointer border-b border-outline-variant border-opacity-50">
<div class="flex flex-col">
<div class="flex items-center gap-2">
<span class="font-headline-md text-headline-md text-on-surface">现金与存款</span>
<span class="bg-surface-container text-on-surface-variant font-label-caps text-label-caps px-2 py-0.5 rounded-full">4 项</span>
</div>
<span class="font-body-sm text-body-sm text-secondary mt-1">¥ 1,250,000.00</span>
</div>
<button class="text-primary hover:bg-surface-container p-1 rounded-full transition-colors">
<span class="material-symbols-outlined" data-icon="add_circle">add_circle</span>
</button>
</div>
<!-- Children Container -->
<div class="pl-tree-indent pr-stack-md py-stack-sm space-y-node-gap relative bg-surface-bright">
<!-- Indentation Guide Line -->
<div class="absolute left-6 top-0 bottom-4 w-px bg-outline-variant opacity-30"></div>
<!-- Level 2: 银行卡 -->
<div class="relative">
<div class="flex items-center justify-between py-2 hover:bg-surface-container-lowest rounded px-2 transition-colors cursor-pointer group">
<div class="flex flex-col">
<span class="font-tree-node text-tree-node text-on-surface">银行卡</span>
<span class="font-body-sm text-body-sm text-secondary">¥ 850,000.00</span>
</div>
<button class="text-on-surface-variant group-hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</div>
<!-- Level 3 (Leaf nodes for 银行卡) -->
<div class="pl-tree-indent space-y-1 mt-1 relative">
<div class="absolute left-3 top-0 bottom-2 w-px bg-outline-variant opacity-30"></div>
<!-- Leaf 1 -->
<div class="flex items-center justify-between py-1.5 hover:bg-surface-container-lowest rounded px-2 transition-colors">
<div class="flex items-center gap-2">
<span class="w-1 h-1 rounded-full bg-outline-variant"></span>
<span class="font-body-sm text-body-sm text-on-surface-variant">招商银行</span>
</div>
<div class="flex items-center gap-3">
<span class="font-body-sm text-body-sm text-secondary">¥ 500,000.00</span>
<button class="font-tree-node text-tree-node text-primary hover:underline">拆分</button>
</div>
</div>
<!-- Leaf 2 -->
<div class="flex items-center justify-between py-1.5 hover:bg-surface-container-lowest rounded px-2 transition-colors">
<div class="flex items-center gap-2">
<span class="w-1 h-1 rounded-full bg-outline-variant"></span>
<span class="font-body-sm text-body-sm text-on-surface-variant">工商银行</span>
</div>
<div class="flex items-center gap-3">
<span class="font-body-sm text-body-sm text-secondary">¥ 350,000.00</span>
<button class="font-tree-node text-tree-node text-primary hover:underline">拆分</button>
</div>
</div>
</div>
</div>
<!-- Level 2: 现金 -->
<div class="flex items-center justify-between py-2 hover:bg-surface-container-lowest rounded px-2 transition-colors cursor-pointer group mt-2">
<div class="flex flex-col">
<span class="font-tree-node text-tree-node text-on-surface">现金</span>
<span class="font-body-sm text-body-sm text-secondary">¥ 400,000.00</span>
</div>
<div class="flex items-center gap-3">
<button class="font-tree-node text-tree-node text-primary hover:underline">拆分</button>
<button class="text-on-surface-variant group-hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</div>
</div>
</div>
</div>
<!-- Category Block 2 -->
<div class="bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant overflow-hidden">
<div class="flex items-center justify-between p-stack-md hover:bg-surface-container-low transition-colors cursor-pointer">
<div class="flex flex-col">
<div class="flex items-center gap-2">
<span class="font-headline-md text-headline-md text-on-surface">投资理财</span>
<span class="bg-surface-container text-on-surface-variant font-label-caps text-label-caps px-2 py-0.5 rounded-full">2 项</span>
</div>
<span class="font-body-sm text-body-sm text-secondary mt-1">¥ 3,500,000.00</span>
</div>
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-outline-variant transition-transform" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
</div>
</main>
<!-- BottomNavBar (Hidden on md, visible on mobile) -->
<nav class="bg-surface-container-lowest dark:bg-surface-dim font-label-caps text-label-caps fixed bottom-0 w-full z-50 border-t border-outline-variant dark:border-outline-muted shadow-md flex justify-around items-center h-16 px-gutter-md md:hidden"><button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-transform scale-95 active:scale-90 w-16 rounded-xl py-1"><span class="material-symbols-outlined mb-1" data-icon="dashboard">dashboard</span><span class="">概览</span></button><button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-transform scale-95 active:scale-90 w-16 rounded-xl py-1"><span class="material-symbols-outlined mb-1" data-icon="account_balance_wallet">account_balance_wallet</span><span class="">资产</span></button><button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-4 py-1 transition-transform scale-95 active:scale-90 w-16"><span class="material-symbols-outlined mb-1" data-icon="category" style="font-variation-settings: 'FILL' 1;">category</span><span class="">分类</span></button><button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high transition-transform scale-95 active:scale-90 w-16 rounded-xl py-1"><span class="material-symbols-outlined mb-1" data-icon="person">person</span><span class="">我的</span></button></nav>


</body></html>
